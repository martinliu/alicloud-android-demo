plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

gradle.ext {
    // Keep push SDK versions centralized for consistent upgrades.
    pushVersion = '3.9.2'
    thirdPushVersion = '3.9.2'
}

android {
    namespace 'com.alibaba.push.android.demo'
    compileSdk 34
    defaultConfig {
        // Ensure this matches the PackageName registered in EMAS.
        applicationId "com.aliyun.emas.pocdemo"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "PUSH_VERSION", "\"${gradle.pushVersion}\""
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    signingConfigs {
        release {
            storeFile file("Test.jks")
            storePassword "test1234"
            keyAlias "test"
            keyPassword "test1234"
        }
        debugConfig {
            storeFile file("Test.jks")
            storePassword "test1234"
            keyAlias "test"
            keyPassword "test1234"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debugConfig
        }
    }
    lint {
        abortOnError false
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    buildFeatures {
        // Required to access BuildConfig.PUSH_VERSION in code.
        viewBinding = true
        dataBinding = true
        buildConfig = true
    }

    // Added to try and fix data binding caching issues
    dataBinding {
        enabled = true
    }
}

kapt {
    // Disable incremental KAPT processing to avoid caching issues
    // incremental = false
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1'
    implementation("androidx.viewpager2:viewpager2:1.0.0")

    // Core Aliyun Mobile Push SDK (required).
    implementation "com.aliyun.ams:alicloud-android-push:${gradle.pushVersion}"
    implementation 'com.google.code.gson:gson:2.8.6'

    // Optional: vendor channel bridge and individual OEM adapters.
    // Remove unused vendors to reduce size and logs.
    api "com.aliyun.ams:alicloud-android-third-push:${gradle.thirdPushVersion}"
    api "com.aliyun.ams:alicloud-android-third-push-meizu:${gradle.thirdPushVersion}" //not a target store
    api "com.aliyun.ams:alicloud-android-third-push-vivo:${gradle.thirdPushVersion}"
    api "com.aliyun.ams:alicloud-android-third-push-oppo:${gradle.thirdPushVersion}"
    api "com.aliyun.ams:alicloud-android-third-push-xiaomi:${gradle.thirdPushVersion}"
    api "com.aliyun.ams:alicloud-android-third-push-huawei:${gradle.thirdPushVersion}"
    api "com.aliyun.ams:alicloud-android-third-push-honor:${gradle.thirdPushVersion}" //not a target store
    api "com.aliyun.ams:alicloud-android-third-push-fcm:${gradle.thirdPushVersion}" //not a target store

}
